name: Achados do Ethan - Automação diária

on:
  pull_request:
    paths:
      - 'scripts/automation/**'
      - 'automation/**'
      - 'src/data/products.json'
      - '.github/workflows/automation-daily.yml'
  workflow_dispatch:
  schedule:
    # 13:00 UTC = 10:00 em Fortaleza (UTC-3)
    - cron: '0 13 * * *'

permissions:
  contents: read

jobs:
  daily-content:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Selecionar 3 produtos
        env:
          MAX_CANDIDATES: '3'
          MAX_PRICE: '80'
        run: node scripts/automation/select-products.mjs

      - name: Gerar conteúdo com Workers AI
        if: github.event_name != 'pull_request'
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_AI_TOKEN: ${{ secrets.CLOUDFLARE_AI_TOKEN }}
          CLOUDFLARE_AI_MODEL: '@cf/meta/llama-3.3-70b-instruct-fp8-fast'
        run: node scripts/automation/generate-content.mjs

      - name: Preparar renderizador de vídeo
        if: github.event_name != 'pull_request'
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core

      - name: Renderizar Reel 9:16
        if: github.event_name != 'pull_request'
        run: node scripts/automation/render-reel.mjs

      - name: Salvar resultado da seleção
        uses: actions/upload-artifact@v4
        with:
          name: produtos-selecionados
          path: automation/output/candidates.json
          retention-days: 14

      - name: Salvar pacote de conteúdo
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: pacote-conteudo-instagram
          path: automation/output/content-package.json
          retention-days: 14

      - name: Salvar Reel renderizado
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: reel-instagram
          path: automation/output/reel-instagram.mp4
          retention-days: 14
