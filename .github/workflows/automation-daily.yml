name: Achados do Ethan - Seleção diária

on:
  workflow_dispatch:
  schedule:
    # 13:00 UTC = 10:00 em Fortaleza (UTC-3)
    - cron: '0 13 * * *'

permissions:
  contents: read

jobs:
  select-products:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Selecionar 3 produtos
        env:
          MAX_CANDIDATES: '3'
          MAX_PRICE: '80'
        run: node scripts/automation/select-products.mjs

      - name: Salvar resultado
        uses: actions/upload-artifact@v4
        with:
          name: produtos-selecionados
          path: automation/output/candidates.json
          retention-days: 14
